<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
<!--commen nav bar, remember to modify later, cause now it kind of double up with the one below, visually -->
{% include "commonNav.html" %}

<!--item page -->

    <main class="item-page">

        <!-- Page header -->
        <div class="section-header">
            <h2>Lager</h2>

            <button type="button" class="add-button" onclick="ShowAddItemForm()">
                + Opprett vare
            </button>
        </div>

        <!-- Filters -->
        <div class="filter">
            <select id="filterStatus">
                <option value="">Alle statuser</option>
                <option value="new">Helt ny</option>
                <option value="repair">Treng reparasjon</option>
                <option value="unavailable">Kan ikke leie ut</option>
            </select>

            <select id="filterCategory">
                <option value="">Alle kategorier</option>
            </select>

            <select id="sortItems">
                <option value="id-desc">ID: nylig til gammel</option>
                <option value="id-asc">ID: gammel til nylig</option>
                <option value="status-asc">Status: A-Å</option>
                <option value="category-asc">Kategori: A-Å</option>
            </select>

            <button type="button" onclick="applyItemFilters()">Filtrer</button>
        </div>

        <!-- Category bookmark tabs -->
        <nav id="category-tabs" class="bookmark-tabs">
            <!-- Always visible All tab -->
            <button
                type="button"
                class="bookmark-tab"
                data-category-id="all"
                onclick="ShowCategoryItems('all')"
            >
                Alle
            </button>

            <span id="category-placeholder" class="nav-placeholder">
                Ingen kategorier ennå
            </span>

            <!-- app.js can add category tabs here -->

            <button
                id="add-category-button"
                type="button"
                onclick="ShowAddCategoryForm()"
                class="bookmark-tab add-tab"
            >
                + Opprett kategori
            </button>
        </nav>

        <!-- Selected category/item content -->
        <section id="category-content" class="category-content">
            <p id="empty-item-message" class="empty-message">
                Ingenting på lager
            </p>

            <div id="item-list" class="item-list">
                <!-- app.js renders item cards here -->
            </div>
        </section>

        <!-- Edit or delete category popup -->
        <div id="editCategoryPopup" class="hidden popup-form">
            <button
                type="button"
                class="popup-close"
                onclick="closePopupForm('editCategoryPopup')"
            >
                ×
            </button>

            <form onsubmit="updateCategory(event)">
                <input type="hidden" id="editCategoryId">

                <label for="editCategoryName">Navn</label>
                <input id="editCategoryName" required>

                <label for="editCategoryDescription">Beskrivelse</label>
                <input id="editCategoryDescription">

                <button type="submit">Lagre endringer</button>
                <button type="button" onclick="deleteCategory()">Slett kategori</button>
            </form>
        </div>

        <!-- Create category popup -->
        <div id="PopCategoryForm" class="hidden popup-form">
            <button
                type="button"
                class="popup-close"
                onclick="closePopupForm('PopCategoryForm')"
            >
                ×
            </button>

            <h2>Opprett ny kategori</h2>

            <form onsubmit="createCategory(event)">
                <label for="categoryName">Navn</label>
                <input id="categoryName" required>

                <label for="categoryDescription">Beskrivelse (valgfri)</label>
                <input id="categoryDescription">

                <button type="submit">Opprett kategori</button>
            </form>
        </div>

        <!-- Create item popup -->
        <div id="PopItemForm" class="hidden popup-form">
            <button
                type="button"
                class="popup-close"
                onclick="closePopupForm('PopItemForm')"
            >
                ×
            </button>

            <h2>Opprett ny vare</h2>

            <form onsubmit="createItem(event)">
                <label for="itemCategory">Kategori</label>
                <select id="itemCategory" name="itemCategory" onchange="handleCategoryChoice()" required>
                    <option value="">Velg kategori</option>
                    <option value="create-new">Opprett kategori</option>
                    <!-- app.js adds categories here -->
                </select>

                <label for="itemName">Navn på vare</label>
                <input id="itemName" required>

                <label for="brand">Merke (valgfri)</label>
                <input id="brand">

                <label for="size">Størrelse (valgfri)</label>
                <input id="size">

                <label for="itemStatus">Status på vare</label>
                <select id="itemStatus" name="itemStatus" required>
                    <option value="new">Helt ny</option>
                    <option value="repair">Treng reparasjon</option>
                    <option value="unavailable">Kan ikke leie ut</option>
                </select>

                <label for="itemComment">Kommentar</label>
                <input id="itemComment">

                <button type="submit">Lagre vare</button>
            </form>
        </div>

    </main>

<script src="/static/app.js"></script>
</body>
</body>
</html>
