<!DOCTYPE html>
<html lang="nb">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js"></script>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Logg inn</h1>
<form onsubmit = "loginAdmin(event)" class = "login-card form">
    <label for = "email"> E-post </label>
    <input id = "email" class = "login-card input" type = "email" required>

    <label for = "password"> Passord </label>
    <input id = "password" class = "login-card input" type = "password" required>

    <button type = "submit"> Logg inn </button>
    <a href = "/register" class = "button" Registere </a>
</form>

<p class="register-text">
    Admin finnes ikke, registere først
    <a href="#" class="disabled-link">Kontakt administrator</a>
</p>

<p id="error-message" class="error"></p>
</body>
</html>
