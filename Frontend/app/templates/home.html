<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <main class="home-page">
        <section class="home-left">
            <h1 class="home-title">Utleiesystem</h1>
            <p class="subtitle">Tromsø Dykkesenter</p>
        </section>

        <section class="login-page">
            <form onsubmit="loginAdmin(event)" class="login-card">
                <h1>Logg inn</h1>

                <label for="login-email">E-post</label>
                <input id="login-email" class="login-card input" type="email" required>

                <label for="login-password">Passord</label>
                <input id="login-password" class="login-card input" type="password" required>

                <div class="login-actions">
                    <button type="submit" class="button">Logg inn</button>
                    <a href="/register" class="button">Registrere</a>
                </div>
            </form>

            <div id="error-message-box" class="error-popup hidden">
                <button type="button" class="error-close" onclick="closeErrorMessage()">×</button>
                <p id="error-message"></p>
            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
